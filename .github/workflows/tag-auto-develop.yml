name: Auto-tag develop

# Creates a SemVer git tag on every push to `develop` (i.e. every merged PR).
# This workflow ONLY creates and pushes a tag — it never builds, deploys, or
# touches Cloud Run. Deployment is handled exclusively by the separate
# deploy_DEV_QA.yml / deploy_PROD.yml workflows.

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  tag:
    runs-on:
      group: digital-01
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute and push next SemVer tag
        run: |
          set -euo pipefail

          git fetch --tags --force

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo v0.0.0)
          echo "Last tag: ${LAST_TAG}"

          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HEAD is already tagged ($(git tag --points-at HEAD)); nothing to do."
            exit 0
          fi

          # Conventional Commits, same pattern enforced by .githooks/commit-msg:
          # <type>(<scope>)!: <description>  — "!" or a BREAKING CHANGE footer = major.
          RANGE="${LAST_TAG}..HEAD"
          if [ "${LAST_TAG}" = "v0.0.0" ]; then
            RANGE="HEAD"
          fi

          SUBJECTS=$(git log ${RANGE} --pretty=%s || true)
          BODIES=$(git log ${RANGE} --pretty=%b || true)

          BUMP=patch
          if grep -qE '^[a-z]+(\([a-z0-9._/-]+\))?!:' <<<"${SUBJECTS}" || grep -q 'BREAKING CHANGE' <<<"${BODIES}"; then
            BUMP=major
          elif grep -qE '^feat(\([a-z0-9._/-]+\))?: ' <<<"${SUBJECTS}"; then
            BUMP=minor
          fi
          echo "Bump type: ${BUMP}"

          VERSION=${LAST_TAG#v}
          MAJOR=$(cut -d. -f1 <<<"${VERSION}")
          MINOR=$(cut -d. -f2 <<<"${VERSION}")
          PATCH=$(cut -d. -f3 <<<"${VERSION}")

          case "${BUMP}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Next tag: ${NEXT_TAG}"

          CHANGELOG=$(git log ${RANGE} --pretty='- %s' | grep -vE '^- Merge ' || true)

          {
            echo "Auto-tag from develop (${BUMP} bump): ${NEXT_TAG}"
            echo ""
            echo "${CHANGELOG}"
          } > /tmp/tag-message.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEXT_TAG}" -F /tmp/tag-message.txt
          git push origin "${NEXT_TAG}"
