name: Manual tag

# Manually creates and pushes a git tag on a chosen branch (main or hotfix/*).
# This workflow ONLY creates and pushes a tag — it never builds, deploys, or
# touches Cloud Run. Deployment to qa/prod is a separate, distinct action.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to tag (main or hotfix/<name>)"
        required: true
        default: main
        type: string
      environment:
        description: "Target environment label (informational only — does not trigger a deploy)"
        required: true
        type: choice
        options:
          - prod
          - qa
      bump:
        description: "Version bump (ignored if custom_tag is set)"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - none
      custom_tag:
        description: "Optional explicit tag, e.g. v1.0.4-hotfix.1 (overrides bump)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on:
      group: digital-01
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Compute and push tag
        env:
          REF: ${{ inputs.ref }}
          ENVIRONMENT: ${{ inputs.environment }}
          BUMP: ${{ inputs.bump }}
          CUSTOM_TAG: ${{ inputs.custom_tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo v0.0.0)
          echo "Last tag reachable from ${REF}: ${LAST_TAG}"

          RANGE="${LAST_TAG}..HEAD"
          if [ "${LAST_TAG}" = "v0.0.0" ]; then
            RANGE="HEAD"
          fi
          CHANGELOG=$(git log ${RANGE} --pretty='- %s' | grep -vE '^- Merge ' || true)

          if [ -n "${CUSTOM_TAG}" ]; then
            if ! grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$' <<<"${CUSTOM_TAG}"; then
              echo "::error::custom_tag '${CUSTOM_TAG}' doesn't look like a valid tag (expected vX.Y.Z, vX.Y.Z.W, or vX.Y.Z-label.N)"
              exit 1
            fi
            if grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' <<<"${CUSTOM_TAG}"; then
              echo "::warning::'${CUSTOM_TAG}' is a 4-component tag. Prefer a pre-release suffix instead, e.g. v1.0.4-hotfix.1 or v1.0.4-rc.1."
            fi
            NEXT_TAG="${CUSTOM_TAG}"
          else
            if [ "${BUMP}" = "none" ]; then
              echo "::error::Either set custom_tag or choose a bump type other than 'none'."
              exit 1
            fi

            VERSION=${LAST_TAG#v}
            MAJOR=$(cut -d. -f1 <<<"${VERSION}")
            MINOR=$(cut -d. -f2 <<<"${VERSION}")
            PATCH=$(cut -d. -f3 <<<"${VERSION}")

            case "${BUMP}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac

            NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          if git rev-parse "${NEXT_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${NEXT_TAG} already exists."
            exit 1
          fi

          echo "Tagging ${REF} (${ENVIRONMENT}) as ${NEXT_TAG}"

          {
            echo "Manual tag for ${ENVIRONMENT} from ${REF}, triggered by ${GITHUB_ACTOR}: ${NEXT_TAG}"
            echo ""
            echo "${CHANGELOG}"
          } > /tmp/tag-message.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEXT_TAG}" -F /tmp/tag-message.txt
          git push origin "${NEXT_TAG}"

          echo "### Tagged :label:" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** ${NEXT_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ref:** ${REF}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment label:** ${ENVIRONMENT}" >> "$GITHUB_STEP_SUMMARY"
